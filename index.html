<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegallyCool — Asesoría legal en marcas y propiedad intelectual</title>
    <meta
      name="description"
      content="LegallyCool, Ariana Isaguirre. Registro de marcas, propiedad intelectual, derecho mercantil, contratos y sociedades. Reservá tu consulta online."
    />

    <!-- Dominio del sitio. OJO: acá va literal porque el HTML no pasa por el bundler; la
         misma URL vive en src/config.ts como SITE_URL para el código, y en public/robots.txt
         y public/sitemap.xml. Si cambia el dominio, hay que tocar esos cuatro lugares. -->
    <link rel="canonical" href="https://legallycool.com.ar/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://legallycool.com.ar/" />
    <meta
      property="og:title"
      content="LegallyCool — Asesoría legal en marcas y propiedad intelectual"
    />
    <meta
      property="og:description"
      content="LegallyCool, Ariana Isaguirre. Registro de marcas, propiedad intelectual, derecho mercantil, contratos y sociedades. Reservá tu consulta online."
    />
    <meta property="og:image" content="https://legallycool.com.ar/brand/logo-legallycool.png" />
    <meta property="og:image:alt" content="LegallyCool — Legal &amp; Marketing Consulting" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LegallyCool — Asesoría legal en marcas y propiedad intelectual"
    />
    <meta
      name="twitter:description"
      content="LegallyCool, Ariana Isaguirre. Registro de marcas, propiedad intelectual, derecho mercantil, contratos y sociedades. Reservá tu consulta online."
    />
    <meta name="twitter:image" content="https://legallycool.com.ar/brand/logo-legallycool.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
